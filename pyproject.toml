[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teamcraft"
version = "0.2.0.dev0"
description = "Local-first orchestration boundaries for TeamCraft"
readme = "README.md"
requires-python = ">=3.10"
# M3-01 API security shell: FastAPI serves the guarded HTTP surface and
# Uvicorn is the default ASGI server (loopback bind enforced in
# teamcraft/api/config.py + serve.py, not by these libraries).
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    # httpx: local API client + FastAPI TestClient transport (CI runs the
    # contract tests right after `pip install .`).
    "httpx>=0.27",
]

[project.optional-dependencies]
# Test-only extras: TestClient needs httpx.
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
teamcraft-api = "teamcraft.api.serve:main"

[tool.setuptools.packages.find]
include = ["teamcraft*"]

# M3-05 minimal web console: the shell is a data directory (no __init__), so
# the three bundled assets must be declared explicitly.  Without this the
# console ships only with editable/source installs; wheel and sdist need the
# package-data entry so teamcraft/api/serve.py's default WEB_ROOT resolves
# inside site-packages after a packaged install.
[tool.setuptools.package-data]
teamcraft = ["api/web/index.html", "api/web/app.js", "api/web/style.css"]
