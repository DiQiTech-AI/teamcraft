name: CI

# M1-07 prerequisite gate (Owner decision 2026-11-02): Python 3.10 + Linux CI
# must be green here before ANY CLI/Skill state-authority or runtime wiring
# change may land.  The ubuntu-latest + Python 3.10 leg is MANDATORY; the
# macos-latest + Python 3.13 leg is baseline only.  Do not weaken or skip the
# Linux/3.10 leg.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}${{ matrix.required == 'mandatory' && ' (M1-07 gate)' || ' (baseline)' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            required: mandatory
          - os: macos-latest
            python-version: "3.13"
            required: baseline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project test dependencies
        run: python -m pip install '.[test]'

      - name: Full unittest suite (core)
        run: python -B -m unittest discover -s tests -v

      - name: Skill contract suite
        run: python -B -m unittest discover -s .agents/skills/teamcraft/tests -v

      - name: Package install check
        run: |
          python -m pip install .
          probe=$(mktemp -d)
          (cd "$probe" && python -c "import teamcraft; v = teamcraft.SCHEMA_VERSION; assert isinstance(v, int) and v > 0, v; assert callable(teamcraft.initialize_project_root); print('installed package import ok, schema_version =', v)")

      - name: Installer smoke (isolated target)
        run: |
          target=$(mktemp -d)
          bash scripts/install.sh --target "$target" --dry-run
          bash scripts/install.sh --target "$target"
          test -f "$target/.agents/skills/teamcraft/scripts/teamctl.py"
          test -f "$target/.agents/skills/teamcraft/SKILL.md"
          (cd "$target" && python -B -m unittest discover -s .agents/skills/teamcraft/tests -v)
